name: Build Documentary Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/documentary-studio-v1
      - feature/documentary-studio-standalone-v2
      - feature/documentary-studio-root-v3
    paths:
      - 'documentary-studio/**'
      - '.github/workflows/documentary-studio-android.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        working-directory: documentary-studio
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: documentary-studio
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot Android and run UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd documentary-studio && gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: documentary-studio-root-v3-apk
          path: documentary-studio/app/build/outputs/apk/debug/app-debug.apk
