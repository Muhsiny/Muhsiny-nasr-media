name: Build Documentary Studio V7 OPEN AI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/documentary-studio-v7-open-ai
    paths:
      - 'documentary-studio/**'
      - 'open-studio-worker/**'
      - '.github/workflows/documentary-studio-android.yml'

concurrency:
  group: documentary-studio-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate open local worker capability and transcription contracts
        run: |
          set -euxo pipefail
          python -m py_compile open-studio-worker/server.py open-studio-worker/ci_stub_dependencies.py
          mkdir -p open-studio-worker/workflows
          echo '{}' > open-studio-worker/workflows/image.json
          echo '{}' > open-studio-worker/workflows/video.json
          cat >/tmp/fake-whisper <<'PY'
          #!/usr/bin/env python3
          import sys
          args=sys.argv
          out=args[args.index('-of')+1]
          with open(out + '.txt','w',encoding='utf-8') as f:
              f.write('رونویسی آزمایشی فارسی برای تست V7')
          PY
          chmod +x /tmp/fake-whisper
          printf 'ci-model' >/tmp/whisper-model.bin
          python open-studio-worker/ci_stub_dependencies.py >/tmp/docstudio-stubs.log 2>&1 &
          STUB_PID=$!
          DOCSTUDIO_IMAGE_WORKFLOW="$PWD/open-studio-worker/workflows/image.json" \
          DOCSTUDIO_VIDEO_WORKFLOW="$PWD/open-studio-worker/workflows/video.json" \
          DOCSTUDIO_WHISPER_BIN=/tmp/fake-whisper \
          DOCSTUDIO_WHISPER_MODEL=/tmp/whisper-model.bin \
          python open-studio-worker/server.py --host 127.0.0.1 --port 8190 --token ci-token >/tmp/docstudio-worker.log 2>&1 &
          WORKER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8190/v1/ping | grep -q 'DocStudio Open Worker'
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:8190/v1/capabilities | tee /tmp/caps.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/caps.json'))
          assert x['director_ai'] is True
          assert x['image'] is True
          assert x['video'] is True
          assert x['transcribe'] is True
          assert x['upscale'] is False
          assert 'ollama' in x['engines'] and 'comfyui' in x['engines'] and 'whisper.cpp' in x['engines']
          PY
          head -c 4096 /dev/urandom >/tmp/ci-audio.wav
          curl -fsS -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/octet-stream' -H 'X-Filename: ci-audio.wav' --data-binary @/tmp/ci-audio.wav http://127.0.0.1:8190/v1/transcribe | tee /tmp/transcript.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/transcript.json'))
          assert 'رونویسی آزمایشی' in x['text']
          assert x['engine'] == 'whisper.cpp'
          PY
          kill "$WORKER_PID" "$STUB_PID" || true

      - uses: actions/download-artifact@v4
        with:
          name: pockettts-farsi-onnx-validated
          path: /tmp/pocket-model-artifact
          github-token: ${{ github.token }}
          run-id: 34188576763

      - name: Bundle only validated INT8 Persian model files
        run: |
          set -euxo pipefail
          ASSETS=documentary-studio/app/src/main/assets/pockettts_fa
          mkdir -p "$ASSETS/model" "$ASSETS/voices"
          for f in tokenizer.model mimi_encoder.onnx text_conditioner.onnx flow_lm_main_int8.onnx flow_lm_flow_int8.onnx mimi_decoder_int8.onnx; do
            src=$(find /tmp/pocket-model-artifact -type f -name "$f" | head -1)
            test -n "$src"
            cp "$src" "$ASSETS/model/$f"
          done
          curl -fL --retry 5 --retry-delay 2 \
            https://huggingface.co/mehdi-hf/pocket-tts-farsi/resolve/main/example_voice.wav \
            -o "$ASSETS/voices/example_voice.wav"
          test -s "$ASSETS/voices/example_voice.wav"
          du -sh "$ASSETS"

      - name: Prepare native PocketTTS Android runtime
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/The-unknown-Shadowman/PocketTTS-Android-Engine.git /tmp/pocket-android
          mkdir -p documentary-studio/vendor/PocketTTS.cpp
          mkdir -p documentary-studio/app/src/main/cpp
          cp /tmp/pocket-android/vendor/PocketTTS.cpp/pocket_tts.cpp documentary-studio/vendor/PocketTTS.cpp/pocket_tts.cpp
          cp /tmp/pocket-android/app/src/main/cpp/CMakeLists.txt documentary-studio/app/src/main/cpp/CMakeLists.txt
          cp /tmp/pocket-android/app/src/main/cpp/jni_bridge.cpp documentary-studio/app/src/main/cpp/jni_bridge.cpp
          sed -i 's/Java_org_pockettts_android_engine_NativePocketTts_/Java_af_muhsiny_docstudio_OnDevicePocketTts_/g' documentary-studio/app/src/main/cpp/jni_bridge.cpp

      - name: Prepare verified ONNX Runtime Android native libraries
        run: |
          set -euxo pipefail
          VER=1.20.0
          AAR_SHA=07a8f71ef890afed8c6087a56220e6d558a492804276ee2dd7cb7f6262242027
          SRC_SHA=5d0aaced52921b86f3f2b2eaac18cbfc96184d73e83baf2553c94d9d306c4de9
          mkdir -p /tmp/ort documentary-studio/app/src/main/jniLibs/arm64-v8a documentary-studio/app/src/main/jniLibs/x86_64 documentary-studio/app/src/main/third_party
          curl -fL "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${VER}/onnxruntime-android-${VER}.aar" -o /tmp/ort/ort.aar
          echo "$AAR_SHA  /tmp/ort/ort.aar" | sha256sum -c -
          unzip -p /tmp/ort/ort.aar jni/arm64-v8a/libonnxruntime.so > documentary-studio/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          unzip -p /tmp/ort/ort.aar jni/x86_64/libonnxruntime.so > documentary-studio/app/src/main/jniLibs/x86_64/libonnxruntime.so
          curl -fL "https://github.com/microsoft/onnxruntime/archive/refs/tags/v${VER}.tar.gz" -o /tmp/ort/src.tar.gz
          echo "$SRC_SHA  /tmp/ort/src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ort/src.tar.gz -C /tmp/ort
          mkdir -p documentary-studio/app/src/main/third_party/onnxruntime
          cp -R "/tmp/ort/onnxruntime-${VER}/include" documentary-studio/app/src/main/third_party/onnxruntime/include
          test -s documentary-studio/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          test -s documentary-studio/app/src/main/jniLibs/x86_64/libonnxruntime.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run V7 unit tests
        working-directory: documentary-studio
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build V7 APK with bundled Persian model
        working-directory: documentary-studio
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit real V7 APK before device test
        run: |
          set -euxo pipefail
          APK=documentary-studio/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 150000000
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpockettts_jni.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libpockettts_jni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          unzip -l "$APK" | grep -q 'assets/pockettts_fa/model/flow_lm_main_int8.onnx'
          unzip -l "$APK" | grep -q 'assets/pockettts_fa/voices/example_voice.wav'
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'V7MainActivity'
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 15 V6 render + Persian on-device + V7 open-AI + Whisper integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096
          disable-animations: true
          script: |
            mkdir -p open-studio-worker/workflows
            echo '{}' > open-studio-worker/workflows/image.json
            echo '{}' > open-studio-worker/workflows/video.json
            cat >/tmp/fake-whisper <<'PY'
            #!/usr/bin/env python3
            import sys
            args=sys.argv
            out=args[args.index('-of')+1]
            with open(out + '.txt','w',encoding='utf-8') as f:
                f.write('رونویسی آزمایشی فارسی برای تست V7')
            PY
            chmod +x /tmp/fake-whisper
            printf 'ci-model' >/tmp/whisper-model.bin
            python open-studio-worker/ci_stub_dependencies.py >/tmp/docstudio-stubs-android.log 2>&1 &
            DOCSTUDIO_IMAGE_WORKFLOW="$PWD/open-studio-worker/workflows/image.json" DOCSTUDIO_VIDEO_WORKFLOW="$PWD/open-studio-worker/workflows/video.json" DOCSTUDIO_WHISPER_BIN=/tmp/fake-whisper DOCSTUDIO_WHISPER_MODEL=/tmp/whisper-model.bin python open-studio-worker/server.py --host 0.0.0.0 --port 8190 --token ci-token >/tmp/docstudio-worker-android.log 2>&1 &
            sleep 2
            curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:8190/v1/capabilities | grep -q '"transcribe": true'
            cd documentary-studio
            gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload only after every V7 test passes
        uses: actions/upload-artifact@v4
        with:
          name: Documentary-Studio-V7-OPEN-AI-FINAL-TESTED
          path: documentary-studio/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 30
