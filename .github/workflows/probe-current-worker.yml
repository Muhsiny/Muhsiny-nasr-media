name: Probe Current NASR Worker
on:
  push:
    branches: [v2-international]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          curl -sS -L --max-time 20 https://nasr-media.com14.workers.dev/ | head -c 5000
          echo
          curl -sS -L --max-time 20 https://nasr-media.com14.workers.dev/api/health
          exit 0
