name: Test Persian Neural Voices

on:
  push:
    branches:
      - feature/documentary-studio-v1
    paths:
      - 'tools/farid_neural_smoke.py'
      - '.github/workflows/farid-neural-smoke.yml'
  workflow_dispatch:

jobs:
  persian-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edge-tts
        run: python -m pip install --upgrade edge-tts
      - name: Generate Persian samples
        run: python tools/farid_neural_smoke.py
      - name: Validate audio files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['farid-neural-fa-IR.mp3','dilara-neural-fa-IR.mp3']:
              p=Path(name)
              assert p.exists(), name
              assert p.stat().st_size > 50000, (name,p.stat().st_size)
              print('validated', name, p.stat().st_size)
          PY
      - name: Upload Persian voice samples
        uses: actions/upload-artifact@v4
        with:
          name: persian-neural-voice-samples
          path: |
            farid-neural-fa-IR.mp3
            dilara-neural-fa-IR.mp3
