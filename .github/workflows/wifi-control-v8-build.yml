name: WiFi Control V8 Router Direct APK

on:
  push:
    branches: [ wifi-control-v7-build ]
    paths:
      - '.github/workflows/wifi-control-v8-build.yml'
      - 'wificontrol-v8-overrides/**'
      - 'wificontrol-v8/**'
      - 'wificontrol-build/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct base source
        shell: bash
        run: |
          set -euo pipefail
          cat wificontrol-build/source.part* | tr -d '\n\r' | base64 -d > /tmp/base.zip
          unzip -t /tmp/base.zip >/dev/null
          rm -rf /tmp/v8
          mkdir -p /tmp/v8
          unzip -q /tmp/base.zip -d /tmp/v8
          test -f /tmp/v8/WiFiControlV6/app/build.gradle

      - name: Apply deterministic V8 patch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v8/WiFiControlV6
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/wificontrol-v8/V8.patch"
          patch -p1 < "$GITHUB_WORKSPACE/wificontrol-v8/V8.patch"
          test -f app/src/main/java/org/sayeh/wificontrol/RouterWebConsoleActivity.java

      - name: Source safety and feature gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v8/WiFiControlV6/app/src/main
          grep -RFn 'restoreState' "$ROOT/java"
          grep -RFn 'RouterWebConsoleActivity' "$ROOT"
          grep -RFn 'QoS / Priority واقعی' "$ROOT/java"
          if grep -RInE 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' "$ROOT/java"; then
            echo "Forbidden destructive router command/text found in Java source"
            exit 1
          fi

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Run core regression tests
        working-directory: /tmp/v8/WiFiControlV6
        shell: bash
        run: bash tools/run_core_tests.sh

      - name: Build V8 APK
        working-directory: /tmp/v8/WiFiControlV6
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate final APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/v8/WiFiControlV6/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/v8-badging.txt
          grep -F "package: name='org.sayeh.wificontrol.v8' versionCode='80' versionName='8.0.0-router-direct'" /tmp/v8-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/v8-signature.txt

          rm -rf /tmp/v8dex && mkdir -p /tmp/v8dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/v8dex
          strings /tmp/v8dex/classes*.dex > /tmp/v8-dex-strings.txt
          grep -F 'rtwlan showmactable' /tmp/v8-dex-strings.txt
          grep -F 'ip arp status' /tmp/v8-dex-strings.txt
          grep -F 'rt node accesspolicy' /tmp/v8-dex-strings.txt
          grep -F 'rt node acladdentry' /tmp/v8-dex-strings.txt
          grep -F 'rt node save' /tmp/v8-dex-strings.txt
          if grep -Ei 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' /tmp/v8-dex-strings.txt; then
            echo "Forbidden destructive router command survived into binary"
            exit 1
          fi

          sha256sum "$APK" | tee /tmp/V8-SHA256.txt
          cp "$APK" /tmp/WiFiControlV8-RouterDirect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiControlV8-RouterDirect-APK
          path: |
            /tmp/WiFiControlV8-RouterDirect.apk
            /tmp/V8-SHA256.txt
            /tmp/v8-badging.txt
            /tmp/v8-signature.txt
          if-no-files-found: error
          retention-days: 7
