name: WiFi Control V8 Final Router Direct APK

on:
  push:
    branches: [ wifi-control-v7-build ]
    paths:
      - '.github/workflows/wifi-control-v8-build.yml'
      - 'wificontrol-v8-source/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct exact V8 source
        shell: bash
        run: |
          set -euo pipefail
          cat wificontrol-v8-source/part* | tr -d '\n\r' | base64 -d > /tmp/WiFiControlV8_min.zip
          echo "cc304b7441d8eddd9418023e5d571211ba4b87c68101274754968373237f4635  /tmp/WiFiControlV8_min.zip" | sha256sum -c -
          unzip -t /tmp/WiFiControlV8_min.zip
          rm -rf /tmp/v8 && mkdir -p /tmp/v8
          unzip -q /tmp/WiFiControlV8_min.zip -d /tmp/v8
          test -f /tmp/v8/WiFiControlV6/app/build.gradle

      - name: Inspect current V8 MainActivity
        shell: bash
        run: |
          sed -n '1,420p' /tmp/v8/WiFiControlV6/app/src/main/java/org/sayeh/wificontrol/MainActivity.java

      - name: Source feature and safety gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v8/WiFiControlV6/app/src/main/java
          grep -RFn 'rtwlan showmactable' "$ROOT"
          grep -RFn 'ip arp status' "$ROOT"
          grep -RFn 'rt node accesspolicy' "$ROOT"
          grep -RFn 'rt node acladdentry' "$ROOT"
          grep -RFn 'rt node save' "$ROOT"
          grep -RFn 'restoreState' "$ROOT"
          test -f "$ROOT/org/sayeh/wificontrol/ScheduleManager.java"
          test -f "$ROOT/org/sayeh/wificontrol/ScheduleReceiver.java"
          test -f "$ROOT/org/sayeh/wificontrol/BootReceiver.java"
          test -f "$ROOT/org/sayeh/wificontrol/SecretStore.java"
          test -f "$ROOT/org/sayeh/wificontrol/RouterWebConsoleActivity.java"
          if grep -RInE 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' "$ROOT"; then
            echo "Forbidden destructive router operation found"
            exit 1
          fi

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build final APK
        working-directory: /tmp/v8/WiFiControlV6
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Validate final APK binary
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/v8/WiFiControlV6/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/v8-badging.txt
          grep -F "package: name='org.sayeh.wificontrol.v8' versionCode='80' versionName='8.0.0-router-direct'" /tmp/v8-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/v8-signature.txt

          rm -rf /tmp/v8dex && mkdir -p /tmp/v8dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/v8dex
          for d in /tmp/v8dex/classes*.dex; do strings "$d"; done > /tmp/v8-dex-strings.txt
          grep -F 'rtwlan showmactable' /tmp/v8-dex-strings.txt
          grep -F 'ip arp status' /tmp/v8-dex-strings.txt
          grep -F 'rt node accesspolicy' /tmp/v8-dex-strings.txt
          grep -F 'rt node acladdentry' /tmp/v8-dex-strings.txt
          grep -F 'rt node save' /tmp/v8-dex-strings.txt
          grep -F 'ScheduleReceiver' /tmp/v8-dex-strings.txt
          grep -F 'SecretStore' /tmp/v8-dex-strings.txt
          grep -F 'RouterWebConsoleActivity' /tmp/v8-dex-strings.txt
          if grep -Ei 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' /tmp/v8-dex-strings.txt; then
            echo "Forbidden destructive router operation survived into APK"
            exit 1
          fi

          sha256sum "$APK" | tee /tmp/V8-SHA256.txt
          cp "$APK" /tmp/WiFiControlV8-Final.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiControlV8-Final-APK
          path: |
            /tmp/WiFiControlV8-Final.apk
            /tmp/V8-SHA256.txt
            /tmp/v8-badging.txt
            /tmp/v8-signature.txt
            /tmp/v8-dex-strings.txt
          if-no-files-found: error
          retention-days: 7
