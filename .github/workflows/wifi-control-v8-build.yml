name: Ayoubi Wifi C iOS APK

on:
  push:
    branches: [ wifi-control-v7-build ]
    paths:
      - '.github/workflows/wifi-control-v8-build.yml'
      - 'wificontrol-v8-source/**'
      - 'wificontrol-v8-ui/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct exact V8 source
        shell: bash
        run: |
          set -euo pipefail
          cat wificontrol-v8-source/part* | tr -d '\n\r' | base64 -d > /tmp/WiFiControlV8_min.zip
          echo "cc304b7441d8eddd9418023e5d571211ba4b87c68101274754968373237f4635  /tmp/WiFiControlV8_min.zip" | sha256sum -c -
          unzip -t /tmp/WiFiControlV8_min.zip >/dev/null
          rm -rf /tmp/v8 && mkdir -p /tmp/v8
          unzip -q /tmp/WiFiControlV8_min.zip -d /tmp/v8
          test -f /tmp/v8/WiFiControlV6/app/build.gradle

      - name: Apply Ayoubi UI without touching router engine
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v8/WiFiControlV6
          JAVA=$ROOT/app/src/main/java/org/sayeh/wificontrol
          find "$JAVA" -type f ! -name 'MainActivity.java' -print0 | sort -z | xargs -0 sha256sum | sha256sum > /tmp/java-before.sha
          python3 wificontrol-v8-ui/redesign.py "$ROOT"
          find "$JAVA" -type f ! -name 'MainActivity.java' -print0 | sort -z | xargs -0 sha256sum | sha256sum > /tmp/java-after.sha
          cmp /tmp/java-before.sha /tmp/java-after.sha

          grep -F 'Ayoubi Wifi -C' "$JAVA/MainActivity.java"
          grep -F 'confirmAllowOnly()' "$JAVA/MainActivity.java"
          grep -F 'confirmEmergency()' "$JAVA/MainActivity.java"
          grep -F 'confirmQuarantineUnknown()' "$JAVA/MainActivity.java"
          grep -F 'toggleMonitor()' "$JAVA/MainActivity.java"
          grep -F 'showHistory()' "$JAVA/MainActivity.java"
          grep -F 'openAdvanced("","")' "$JAVA/MainActivity.java"
          grep -F 'runDiagnostics()' "$JAVA/MainActivity.java"
          grep -F 'saveCurrentBackup()' "$JAVA/MainActivity.java"
          grep -F 'restoreBackup()' "$JAVA/MainActivity.java"
          grep -F 'scheduleDialog(d)' "$JAVA/MainActivity.java"
          grep -F 'runBlock(d,!blocked)' "$JAVA/MainActivity.java"

      - name: Feature and safety gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v8/WiFiControlV6/app/src/main/java
          grep -RFn 'rtwlan showmactable' "$ROOT"
          grep -RFn 'ip arp status' "$ROOT"
          grep -RFn 'rt node accesspolicy' "$ROOT"
          grep -RFn 'rt node acladdentry' "$ROOT"
          grep -RFn 'rt node save' "$ROOT"
          grep -RFn 'restoreState' "$ROOT"
          test -f "$ROOT/org/sayeh/wificontrol/ScheduleManager.java"
          test -f "$ROOT/org/sayeh/wificontrol/ScheduleReceiver.java"
          test -f "$ROOT/org/sayeh/wificontrol/BootReceiver.java"
          test -f "$ROOT/org/sayeh/wificontrol/SecretStore.java"
          test -f "$ROOT/org/sayeh/wificontrol/RouterWebConsoleActivity.java"
          if grep -RInE 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' "$ROOT"; then
            echo "Forbidden destructive router operation found"
            exit 1
          fi

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: /tmp/v8/WiFiControlV6
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/v8/WiFiControlV6/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          "$AAPT" dump badging "$APK" | tee /tmp/ayoubi-badging.txt
          grep -F "package: name='org.sayeh.wificontrol.v8' versionCode='81' versionName='8.1.0-ayoubi-ios'" /tmp/ayoubi-badging.txt
          grep -F "application-label:'Ayoubi Wifi -C'" /tmp/ayoubi-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/ayoubi-signature.txt

          rm -rf /tmp/ayoubidex && mkdir -p /tmp/ayoubidex
          unzip -q "$APK" 'classes*.dex' -d /tmp/ayoubidex
          for d in /tmp/ayoubidex/classes*.dex; do strings "$d"; done > /tmp/ayoubi-dex.txt

          grep -F 'Ayoubi Wifi -C' /tmp/ayoubi-dex.txt
          grep -F 'rtwlan showmactable' /tmp/ayoubi-dex.txt
          grep -F 'ip arp status' /tmp/ayoubi-dex.txt
          grep -F 'rt node accesspolicy' /tmp/ayoubi-dex.txt
          grep -F 'rt node acladdentry' /tmp/ayoubi-dex.txt
          grep -F 'rt node save' /tmp/ayoubi-dex.txt
          grep -F 'ScheduleReceiver' /tmp/ayoubi-dex.txt
          grep -F 'SecretStore' /tmp/ayoubi-dex.txt
          grep -F 'RouterWebConsoleActivity' /tmp/ayoubi-dex.txt

          if grep -Ei 'factory[ _-]*reset|firmware[ _-]*(flash|upgrade)|rt node reboot|sys reboot|erase flash' /tmp/ayoubi-dex.txt; then
            echo "Forbidden destructive router operation survived into APK"
            exit 1
          fi

          sha256sum "$APK" | tee /tmp/Ayoubi-Wifi-C-SHA256.txt
          cp "$APK" /tmp/Ayoubi-Wifi-C.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ayoubi-Wifi-C-APK
          path: |
            /tmp/Ayoubi-Wifi-C.apk
            /tmp/Ayoubi-Wifi-C-SHA256.txt
            /tmp/ayoubi-badging.txt
            /tmp/ayoubi-signature.txt
          if-no-files-found: error
          retention-days: 7
