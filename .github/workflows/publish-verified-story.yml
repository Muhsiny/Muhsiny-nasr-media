name: NASR Publish Verified Story

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-verified-story.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified newsroom article
        id: create
        shell: bash
        run: |
          cat > /tmp/article.json <<'JSON'
          {
            "title": "پاکستان از کشته‌شدن ۲۸ شبه‌نظامی در حملات هوایی داخل افغانستان خبر داد؛ کابل کشته‌شدن سه غیرنظامی را گزارش کرد",
            "summary": "پاکستان اعلام کرده است در حملات هوایی ۲۱ سپتامبر به سه هدف در افغانستان ۲۸ فردی که آنان را شبه‌نظامی خوانده کشته شده‌اند. مقام‌های افغانستان گفته‌اند در این حملات سه غیرنظامی نیز کشته و چهار نفر زخمی شده‌اند. روایت دو طرف درباره هویت همه قربانیان یکسان نیست.",
            "body": "پاکستان در ۲۱ سپتامبر ۲۰۲۶ اعلام کرد جنگنده‌های این کشور سه هدف را در داخل افغانستان بمباران کرده‌اند و در نتیجه ۲۸ نفر که اسلام‌آباد آنان را «تروریست» و بمب‌گذار انتحاری معرفی کرده، کشته شده‌اند. رویترز این ادعای وزارت اطلاعات پاکستان را گزارش کرده است.\n\nدر مقابل، مقام‌های افغانستان گفته‌اند این حملات تلفات غیرنظامی نیز داشته است. آسوشیتدپرس گزارش کرده که مقام‌های افغان از کشته‌شدن سه غیرنظامی و زخمی‌شدن چهار نفر خبر داده‌اند. به گزارش AP، مأموریت سازمان ملل در افغانستان نیز تلفات غیرنظامی را تأیید کرده و بر رعایت حقوق بشردوستانه بین‌المللی تأکید کرده است.\n\nنصر مدیا ادعای پاکستان درباره هویت همه کشته‌شدگان را به‌عنوان ادعای رسمی اسلام‌آباد نقل می‌کند و آن را واقعیت مستقل و اثبات‌شده تلقی نمی‌کند.\n\nمنابع: Reuters و Associated Press.",
            "category": "افغانستان",
            "language": "fa",
            "content_type": "news",
            "original_url": "https://www.reuters.com/world/asia-pacific/pakistan-says-28-killed-airstrikes-three-targets-afghanistan-2026-09-21/",
            "source_urls": [
              "https://www.reuters.com/world/asia-pacific/pakistan-says-28-killed-airstrikes-three-targets-afghanistan-2026-09-21/",
              "https://apnews.com/article/95178c5833c7a6a621c9bb0f06a78915"
            ]
          }
          JSON

          code=$(curl -sS -o /tmp/create.json -w "%{http_code}"             -X POST "https://nasr-media.com14.workers.dev/api/articles"             -H "content-type: application/json"             --data-binary @/tmp/article.json)
          echo "create_http=$code"
          cat /tmp/create.json
          echo
          test "$code" = "201"
          id=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/create.json',encoding='utf-8'))['id'])
          PY
          )
          echo "article_id=$id" >> "$GITHUB_OUTPUT"

      - name: Approve and publish
        shell: bash
        env:
          ARTICLE_ID: ${{ steps.create.outputs.article_id }}
        run: |
          code=$(curl -sS -o /tmp/approve.json -w "%{http_code}"             -X POST "https://nasr-media.com14.workers.dev/api/approvals"             -H "content-type: application/json"             --data-binary "{\"articleId\":\"$ARTICLE_ID\",\"decision\":\"approved\",\"note\":\"Verified manual publication: Reuters + AP\"}")
          echo "approve_http=$code"
          cat /tmp/approve.json
          echo
          test "$code" = "200"

      - name: Verify article is live
        shell: bash
        env:
          ARTICLE_ID: ${{ steps.create.outputs.article_id }}
        run: |
          curl -fsS "https://nasr-media.com14.workers.dev/api/articles/$ARTICLE_ID" -o /tmp/live.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/live.json',encoding='utf-8'))
          print("status=",row.get("status"))
          print("title=",row.get("title"))
          if row.get("status") != "published":
              raise SystemExit("Article not published")
          PY
