name: Package Nadaye Beheshti v5.0 final

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore validated source and apply durable central backend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9686402260/zip" \
            -o /tmp/v47-artifact.zip
          unzip -j -o /tmp/v47-artifact.zip generated-MainActivity.java -d /tmp
          cp /tmp/generated-MainActivity.java android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          if [ ! -e android-nadaye/app/src/main/res/drawable/leader_hero.xml ] && [ ! -e android-nadaye/app/src/main/res/drawable/leader_hero.png ]; then
            cp android-nadaye/app/src/main/res/drawable/ic_launcher.xml android-nadaye/app/src/main/res/drawable/leader_hero.xml
          fi
          python3 android-hardening/v48_central_fix.py
          python3 android-hardening/v49_webview_bridge.py
          python3 android-hardening/v50_direct_lovable.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('android-nadaye/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 15',s)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '5.0.0'",s)
          g.write_text(s,encoding='utf-8')
          p=Path('android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java')
          s=p.read_text(encoding='utf-8').replace('نسخه ۴.۷','نسخه ۵.۰').replace('نسخه ۴.۸','نسخه ۵.۰').replace('نسخه ۴.۹','نسخه ۵.۰')
          p.write_text(s,encoding='utf-8')
          PY
          mkdir -p android-nadaye/app/src/main/assets android-nadaye/app/src/main/res/raw
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan.ogg' -o android-nadaye/app/src/main/res/raw/default_adhan.ogg
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/aminpaydar/Mafatih/master/mafatih-server/chapters.json' -o android-nadaye/app/src/main/assets/mafatih.json
          printf '%s\n' 'Bundled fallback adhan: Wikimedia Commons File:Adhan.ogg, Aishatu98, CC0 1.0 Universal.' > android-nadaye/app/src/main/assets/ADHAN-LICENSE.txt
          printf '%s\n' 'Mafatih text dataset: aminpaydar/Mafatih, Apache License 2.0.' > android-nadaye/app/src/main/assets/MAFATIH-LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('android-nadaye/app/src/main/assets/quran.json').read_text(encoding='utf-8'))
          assert len(q)==114 and sum(len(x.get('verses',[])) for x in q)>=6200
          m=json.loads(Path('android-nadaye/app/src/main/assets/mafatih.json').read_text(encoding='utf-8'))
          assert isinstance(m,list) and len(m)>0
          a=Path('android-nadaye/app/src/main/res/raw/default_adhan.ogg')
          assert a.stat().st_size>100000 and a.read_bytes()[:4]==b'OggS'
          PY
          cp android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java generated-MainActivity.java
          grep -q 'versionCode 15' android-nadaye/app/build.gradle
          grep -q "versionName '5.0.0'" android-nadaye/app/build.gradle
          grep -q 'showTopTitleEditor' generated-MainActivity.java
          grep -q 'heroDisplayHeight' generated-MainActivity.java
          grep -q 'centralPinHash' generated-MainActivity.java
          grep -q 'owner/recover-legacy' generated-MainActivity.java
          grep -q 'server_verification_failed' generated-MainActivity.java
          grep -q 'https://nadaye-beheshti-central-api.lovable.app' generated-MainActivity.java
          grep -q 'central_non_json' generated-MainActivity.java
          grep -q '/api/asset-chunk' generated-MainActivity.java
          grep -q '/api/asset-finalize' generated-MainActivity.java
          ! grep -q 'nativeBridge=1&v=49' generated-MainActivity.java

      - name: Build final APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          SRC=android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$SRC"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$SRC" Nadaye-Beheshti-5.0-Final-Unsigned.apk
          unzip -t Nadaye-Beheshti-5.0-Final-Unsigned.apk >/dev/null
          "$AAPT" dump badging Nadaye-Beheshti-5.0-Final-Unsigned.apk > badging.txt
          grep -F "package: name='com.nadaye.beheshti' versionCode='15' versionName='5.0.0'" badging.txt
          sha256sum Nadaye-Beheshti-5.0-Final-Unsigned.apk > SHA256.txt
          cp "$APKSIGNER_JAR" apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-5.0-Final-Unsigned
          path: |
            Nadaye-Beheshti-5.0-Final-Unsigned.apk
            apksigner.jar
            SHA256.txt
            badging.txt
            generated-MainActivity.java
          if-no-files-found: error
          retention-days: 30
