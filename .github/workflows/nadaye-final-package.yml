name: Package Nadaye Beheshti v4.7 final

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble final source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://at.adobe.com/KYtdZd634HeDuZGm' -o /tmp/premium.zip
          echo 'e7e4a578e91f119d7164eba0e9cdc3ca6de7014a09a353f821467c9b53492237  /tmp/premium.zip' | sha256sum -c -
          unzip -o /tmp/premium.zip -d android-nadaye
          python3 android-hardening/apply.py
          python3 android-hardening/runtime_helpers.py
          cat android-hardening/v44_part1.py android-hardening/v44_part2.py android-hardening/v44_part3.py > /tmp/v44_upgrade.py
          python3 -m py_compile /tmp/v44_upgrade.py
          python3 /tmp/v44_upgrade.py
          python3 android-hardening/v45_cover.py
          python3 android-hardening/v46_central.py
          python3 android-hardening/v47_editor_polish.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('android-nadaye/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 12',s)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '4.7.0'",s)
          g.write_text(s,encoding='utf-8')
          PY
          mkdir -p android-nadaye/app/src/main/assets android-nadaye/app/src/main/res/raw
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan.ogg' -o android-nadaye/app/src/main/res/raw/default_adhan.ogg
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/aminpaydar/Mafatih/master/mafatih-server/chapters.json' -o android-nadaye/app/src/main/assets/mafatih.json
          printf '%s\n' 'Bundled fallback adhan: Wikimedia Commons File:Adhan.ogg, Aishatu98, CC0 1.0 Universal.' > android-nadaye/app/src/main/assets/ADHAN-LICENSE.txt
          printf '%s\n' 'Mafatih text dataset: aminpaydar/Mafatih, Apache License 2.0.' > android-nadaye/app/src/main/assets/MAFATIH-LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('android-nadaye/app/src/main/assets/quran.json').read_text(encoding='utf-8'))
          assert len(q)==114 and sum(len(x.get('verses',[])) for x in q)>=6200
          m=json.loads(Path('android-nadaye/app/src/main/assets/mafatih.json').read_text(encoding='utf-8'))
          assert isinstance(m,list) and len(m)>0
          a=Path('android-nadaye/app/src/main/res/raw/default_adhan.ogg')
          assert a.stat().st_size>100000 and a.read_bytes()[:4]==b'OggS'
          PY
          cp android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java generated-MainActivity.java
          grep -q 'versionCode 12' android-nadaye/app/build.gradle
          grep -q "versionName '4.7.0'" android-nadaye/app/build.gradle
          grep -q 'showCentralPublisher' generated-MainActivity.java
          grep -q 'showTopTitleEditor' generated-MainActivity.java
          grep -q 'heroDisplayHeight' generated-MainActivity.java
          grep -q 'ownerField' generated-MainActivity.java
          grep -q 'REQ_TITLE_FONT=816' generated-MainActivity.java
          grep -q 'k.startsWith("title.")' generated-MainActivity.java

      - name: Build final APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          SRC=android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$SRC"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$SRC" Nadaye-Beheshti-4.7-Final-Unsigned.apk
          unzip -t Nadaye-Beheshti-4.7-Final-Unsigned.apk >/dev/null
          "$AAPT" dump badging Nadaye-Beheshti-4.7-Final-Unsigned.apk > badging.txt
          grep -F "package: name='com.nadaye.beheshti' versionCode='12' versionName='4.7.0'" badging.txt
          sha256sum Nadaye-Beheshti-4.7-Final-Unsigned.apk > SHA256.txt
          cp "$APKSIGNER_JAR" apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-4.7-Final-Unsigned
          path: |
            Nadaye-Beheshti-4.7-Final-Unsigned.apk
            apksigner.jar
            SHA256.txt
            badging.txt
            generated-MainActivity.java
          if-no-files-found: error
          retention-days: 30
