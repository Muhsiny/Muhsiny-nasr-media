name: Package Nadaye Beheshti v5.1 final

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore validated base and bake all final public features
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9686402260/zip" \
            -o /tmp/v47-artifact.zip
          unzip -j -o /tmp/v47-artifact.zip generated-MainActivity.java -d /tmp
          cp /tmp/generated-MainActivity.java android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java

          python3 android-hardening/v48_central_fix.py
          python3 android-hardening/v49_webview_bridge.py
          python3 android-hardening/v50_direct_lovable.py

          mkdir -p android-nadaye/app/src/main/assets android-nadaye/app/src/main/res/raw android-nadaye/app/src/main/res/drawable
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Example.jpg' -o android-nadaye/app/src/main/res/drawable/nadaye_locked_cover.jpg
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o android-nadaye/app/src/main/assets/amiri_regular.ttf
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/OFL.txt' -o android-nadaye/app/src/main/assets/AMIRI-OFL.txt
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/aminpaydar/Mafatih/master/mafatih-server/chapters.json' -o android-nadaye/app/src/main/assets/mafatih.json
          printf '%s\n' 'Mafatih text dataset: aminpaydar/Mafatih, Apache License 2.0.' > android-nadaye/app/src/main/assets/MAFATIH-LICENSE.txt

          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan.ogg' -o /tmp/adhan1.ogg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Beautiful_adhan.ogg' -o /tmp/adhan2.ogg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Muslim_calling_to_prayer.ogg' -o /tmp/adhan3.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/adhan1.ogg -af 'loudnorm=I=-14:TP=-1:LRA=7' -c:a libvorbis -q:a 6 android-nadaye/app/src/main/res/raw/default_adhan.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/adhan2.ogg -af 'loudnorm=I=-14:TP=-1:LRA=7' -c:a libvorbis -q:a 6 android-nadaye/app/src/main/res/raw/adhan_beautiful.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/adhan3.ogg -af 'loudnorm=I=-14:TP=-1:LRA=7' -c:a libvorbis -q:a 6 android-nadaye/app/src/main/res/raw/adhan_azan.ogg
          cat > android-nadaye/app/src/main/assets/ADHAN-LICENSE.txt <<'EOF'
          Adhan.ogg — Wikimedia Commons — CC0 1.0 Universal.
          Beautiful adhan.ogg — Adam-synagda — Wikimedia Commons — CC0 1.0 Universal.
          Muslim calling to prayer.ogg — Aishatu98 — Wikimedia Commons — CC0 1.0 Universal.
          The packaged copies have only loudness normalization applied for consistent alarm playback.
          EOF

          python3 android-hardening/v51_locked_cover.py
          python3 android-hardening/v52_top_kalima.py
          python3 android-hardening/final_stage3_icons.py
          python3 android-hardening/final_stage4_core.py
          python3 android-hardening/final_stage4_adhan_ui.py
          python3 android-hardening/v53_final_completion.py

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          g=Path('android-nadaye/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 16',s)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '5.1.0'",s)
          g.write_text(s,encoding='utf-8')
          p=Path('android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('نسخه ۴.۷','نسخه ۵.۱').replace('نسخه ۴.۸','نسخه ۵.۱').replace('نسخه ۴.۹','نسخه ۵.۱').replace('نسخه ۵.۰','نسخه ۵.۱')
          p.write_text(s,encoding='utf-8')
          q=json.loads(Path('android-nadaye/app/src/main/assets/quran.json').read_text(encoding='utf-8'))
          assert len(q)==114 and sum(len(x.get('verses',[])) for x in q)>=6200
          m=json.loads(Path('android-nadaye/app/src/main/assets/mafatih.json').read_text(encoding='utf-8'))
          assert isinstance(m,list) and len(m)>0
          titles=[]
          for c in m:
              for se in c.get('sections',[]) or []:
                  for ar in se.get('articles',[]) or []:
                      titles.append(ar.get('title',''))
          joined='\n'.join(titles).replace('ي','ی').replace('ك','ک')
          for need in ['توسل','عاشورا','کمیل','عهد']:
              assert need in joined, need
          for f in ['default_adhan.ogg','adhan_beautiful.ogg','adhan_azan.ogg']:
              a=Path('android-nadaye/app/src/main/res/raw')/f
              assert a.stat().st_size>100000 and a.read_bytes()[:4]==b'OggS'
          assert Path('android-nadaye/app/src/main/assets/amiri_regular.ttf').stat().st_size>100000
          PY

          cp android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java generated-MainActivity.java
          grep -q 'versionCode 16' android-nadaye/app/build.gradle
          grep -q "versionName '5.1.0'" android-nadaye/app/build.gradle
          grep -q 'R.drawable.nadaye_locked_cover' generated-MainActivity.java
          grep -q 'لا إله إلا الله محمد رسول الله' generated-MainActivity.java
          grep -q 'amiri_regular.ttf' generated-MainActivity.java
          grep -q 'applyProIcon' generated-MainActivity.java
          grep -q 'startQuranSurah' generated-MainActivity.java
          grep -q 'playQueuedAyah' generated-MainActivity.java
          grep -q 'allMafatihArticles' generated-MainActivity.java
          grep -q 'دعای توسل' generated-MainActivity.java
          grep -q 'زیارت عاشورا' generated-MainActivity.java
          ! grep -q 'Central owner publishing' generated-MainActivity.java
          ! grep -q 'centralSyncAsync(false)' generated-MainActivity.java
          ! grep -q 'showCentralPublisher()' generated-MainActivity.java
          grep -q 'BUILTIN_RAW' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          grep -q 'STREAM_ALARM' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java

      - name: Build final APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          SRC=android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$SRC"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$SRC" Nadaye-Beheshti-5.1-Final-Unsigned.apk
          unzip -t Nadaye-Beheshti-5.1-Final-Unsigned.apk >/dev/null
          unzip -l Nadaye-Beheshti-5.1-Final-Unsigned.apk > apk-entries.txt
          grep -i 'nadaye_locked_cover\|locked_cover' apk-entries.txt > cover-entry.txt || true
          "$AAPT" dump badging Nadaye-Beheshti-5.1-Final-Unsigned.apk > badging.txt
          grep -F "package: name='com.nadaye.beheshti' versionCode='16' versionName='5.1.0'" badging.txt
          sha256sum Nadaye-Beheshti-5.1-Final-Unsigned.apk > SHA256.txt
          cp "$APKSIGNER_JAR" apksigner.jar
          cp "$ZIPALIGN" zipalign
          chmod +x zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-5.1-Final-Unsigned
          path: |
            Nadaye-Beheshti-5.1-Final-Unsigned.apk
            apksigner.jar
            zipalign
            SHA256.txt
            badging.txt
            cover-entry.txt
            apk-entries.txt
            generated-MainActivity.java
          if-no-files-found: error
          retention-days: 30
