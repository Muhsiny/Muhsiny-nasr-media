name: Validate Original NASR Cloudflare Migration
on:
  push:
    branches: [nasr-cloudflare-original]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config wrangler.toml
      - run: npx wrangler deploy --dry-run --config wrangler.production.toml
