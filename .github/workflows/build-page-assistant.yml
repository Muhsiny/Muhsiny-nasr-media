name: Build Media Page Assistant APK

on:
  push:
    branches:
      - page-assistant-build
    paths:
      - 'android-page-assistant/**'
      - '.github/workflows/build-page-assistant.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: android-page-assistant
        run: gradle assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp android-page-assistant/app/build/outputs/apk/debug/app-debug.apk Media-Page-Assistant.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-Page-Assistant-APK
          path: Media-Page-Assistant.apk
          if-no-files-found: error
