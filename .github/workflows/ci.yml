name: NASR MEDIA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Check Worker syntax
        run: node --check worker/src/index.js && node --check worker/src/ingest.js && node --check worker/src/agents.js
