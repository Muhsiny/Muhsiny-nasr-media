name: Build Nadaye Beheshti Android

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare bundled offline assets
        working-directory: android-nadaye
        run: |
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/assets
          curl -L --fail --retry 3 'https://at.adobe.com/LQuaQU9N4D5SD3sT' -o app/src/main/res/drawable-nodpi/home_reference.png
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/CheeseWithSauce/TheHolyQuranJSONFormat/main/quran.json' -o app/src/main/assets/quran.json
          test -s app/src/main/res/drawable-nodpi/home_reference.png
          test -s app/src/main/assets/quran.json
      - name: Build debug APK
        working-directory: android-nadaye
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: cp android-nadaye/app/build/outputs/apk/debug/app-debug.apk Nadaye-Beheshti-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-Android-APK
          path: Nadaye-Beheshti-1.0.apk
          if-no-files-found: error
