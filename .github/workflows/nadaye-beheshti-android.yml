name: Build Nadaye Beheshti Android v2

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v2 source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://at.adobe.com/NRSTWjl5LIQnBE3z' -o /tmp/nadaye-v2.zip
          echo '004d56b0c62cfb68d4f8aa08db3e42f744e031c7b27e89c9bdb56bc3229a5e36  /tmp/nadaye-v2.zip' | sha256sum -c -
          unzip -o /tmp/nadaye-v2.zip -d android-nadaye
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-nadaye/app/src/main/java/com/nadaye/beheshti')
          for p in root.glob('*.java'):
              s = p.read_text(encoding='utf-8')
              s = s.replace(';\\nimport ', ';\nimport ')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Prepare verified offline Quran and default adhan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-nadaye/app/src/main/assets android-nadaye/app/src/main/res/raw
          curl -L --fail --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          curl -L --fail --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Adhan_Al_Aqsa_-_Jerusalem_(%D8%A3%D8%B0%D8%A7%D9%86_%D8%A7%D9%84%D9%85%D8%B3%D8%AC%D8%AF_%D8%A7%D9%84%D8%A3%D9%82%D8%B5%D9%89_-_%D8%A7%D9%84%D9%82%D8%AF%D8%B3).mp3' -o android-nadaye/app/src/main/res/raw/adhan_default.mp3
          python3 - <<'PY'
          import json
          from pathlib import Path
          q = Path('android-nadaye/app/src/main/assets/quran.json')
          d = json.loads(q.read_text(encoding='utf-8'))
          assert isinstance(d, list) and len(d) == 114, 'Quran must contain 114 surahs'
          verses = sum(len(c.get('verses', [])) for c in d)
          assert verses >= 6200, f'Quran verse count too small: {verses}'
          assert d[0].get('name') and d[0].get('verses'), 'Quran structure invalid'
          a = Path('android-nadaye/app/src/main/res/raw/adhan_default.mp3')
          assert a.stat().st_size > 100000, 'Adhan file is too small'
          h = a.read_bytes()[:3]
          assert h == b'ID3' or h[:1] == b'\xff', f'Adhan is not an MP3: {h!r}'
          hero = Path('android-nadaye/app/src/main/res/drawable-nodpi/leader_hero.jpg')
          assert hero.exists() and hero.stat().st_size > 10000, 'Hero image missing'
          print('Validated Quran:', verses, 'verses; adhan:', a.stat().st_size, 'bytes; hero:', hero.stat().st_size, 'bytes')
          PY

      - name: Build release APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$UNSIGNED"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f 4 "$UNSIGNED" Nadaye-Beheshti-2.0-aligned.apk
          PASS=$(openssl rand -hex 18)
          keytool -genkeypair -v -keystore nadaye-beheshti-release.jks -storepass "$PASS" -keypass "$PASS" -alias nadaye -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Nadaye Beheshti, OU=Android, O=Nadaye Beheshti, C=AF'
          "$APKSIGNER" sign --ks nadaye-beheshti-release.jks --ks-key-alias nadaye --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Nadaye-Beheshti-2.0.apk Nadaye-Beheshti-2.0-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Nadaye-Beheshti-2.0.apk
          rm -f Nadaye-Beheshti-2.0-aligned.apk
          printf 'Nadaye Beheshti Android release signing backup\nAlias: nadaye\nStore password: %s\nKey password: %s\n\nKeep this file together with nadaye-beheshti-release.jks. Future APK updates must be signed with the same key.\n' "$PASS" "$PASS" > SIGNING-KEY.txt

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s Nadaye-Beheshti-2.0.apk
          unzip -t Nadaye-Beheshti-2.0.apk >/dev/null
          unzip -l Nadaye-Beheshti-2.0.apk | grep 'assets/quran.json' >/dev/null
          unzip -p Nadaye-Beheshti-2.0.apk assets/quran.json > /tmp/quran-packed.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/quran-packed.json',encoding='utf-8'))
          assert len(d)==114 and sum(len(x.get('verses',[])) for x in d)>=6200
          PY
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging Nadaye-Beheshti-2.0.apk | grep "package: name='com.nadaye.beheshti'" >/dev/null
          sha256sum Nadaye-Beheshti-2.0.apk > APK-SHA256.txt
          echo 'APK smoke checks passed'

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-2.0-Release
          path: |
            Nadaye-Beheshti-2.0.apk
            APK-SHA256.txt
            nadaye-beheshti-release.jks
            SIGNING-KEY.txt
          if-no-files-found: error
          retention-days: 90
