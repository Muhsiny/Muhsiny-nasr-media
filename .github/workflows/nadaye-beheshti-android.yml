name: Build Nadaye Beheshti Android v3 final

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply final v3 source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://at.adobe.com/u5q2YXUICb6h59x1' -o /tmp/nadaye-v3.zip
          echo '0776df5717d547e802327f4ce18b667472659899bfd3012b984c7701cf05b615  /tmp/nadaye-v3.zip' | sha256sum -c -
          unzip -o /tmp/nadaye-v3.zip -d android-nadaye
          grep -q 'void showAdminStudio()' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'hiddenTapCount>=7' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'builtInAdhanNames' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'stream-0wonG' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          grep -q 'stream-j7q3b' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          grep -q 'stream-7Lntd' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          grep -q 'stream-EPfRi' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          echo 'Owner studio and four Shia muezzin profiles are present in source.'

      - name: Prepare verified offline Quran text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-nadaye/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('android-nadaye/app/src/main/assets/quran.json')
          d=json.loads(q.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==114
          verses=sum(len(x.get('verses',[])) for x in d)
          assert verses>=6200
          hero=Path('android-nadaye/app/src/main/res/drawable-nodpi/leader_hero.jpg')
          assert hero.exists() and hero.stat().st_size>10000
          print('Validated Quran:',len(d),'surahs /',verses,'verses; hero:',hero.stat().st_size,'bytes')
          PY

      - name: Build release APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Align unsigned APK and collect signing tool
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$UNSIGNED"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          test -x "$ZIPALIGN"
          test -s "$APKSIGNER_JAR"
          "$ZIPALIGN" -f 4 "$UNSIGNED" Nadaye-Beheshti-3.0-aligned-unsigned.apk
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Smoke check unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Nadaye-Beheshti-3.0-aligned-unsigned.apk
          unzip -t Nadaye-Beheshti-3.0-aligned-unsigned.apk >/dev/null
          unzip -l Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep 'assets/quran.json' >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep "package: name='com.nadaye.beheshti'" >/dev/null
          "$AAPT" dump badging Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep "versionCode='3'" >/dev/null
          sha256sum Nadaye-Beheshti-3.0-aligned-unsigned.apk > UNSIGNED-SHA256.txt
          echo 'Unsigned APK smoke checks passed'

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-3.0-Unsigned
          path: |
            Nadaye-Beheshti-3.0-aligned-unsigned.apk
            apksigner.jar
            UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 30
