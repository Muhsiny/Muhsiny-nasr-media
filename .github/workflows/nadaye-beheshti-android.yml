name: Verify Shiavoice Shia adhan streams

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify four Shia adhan streams
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'abather 0wonG' 'moazenzadeh j7q3b' 'hadi 7Lntd' 'bouabbas EPfRi'; do
            set -- $pair; name=$1; id=$2
            echo "=== $name / $id ==="
            curl -A 'Mozilla/5.0' -e "https://shiavoice.com/play-$id" -L --fail --retry 2 "https://shiavoice.com/stream-$id" -o "/tmp/$name.audio"
            stat -c '%n %s bytes' "/tmp/$name.audio"
            file "/tmp/$name.audio"
            test $(stat -c%s "/tmp/$name.audio") -gt 100000
          done
