name: Legacy Nadaye Beheshti Android v4 build (manual only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply premium v4 source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://at.adobe.com/KYtdZd634HeDuZGm' -o /tmp/nadaye-v4.zip
          echo 'e7e4a578e91f119d7164eba0e9cdc3ca6de7014a09a353f821467c9b53492237  /tmp/nadaye-v4.zip' | sha256sum -c -
          unzip -o /tmp/nadaye-v4.zip -d android-nadaye

      - name: Build legacy APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace
