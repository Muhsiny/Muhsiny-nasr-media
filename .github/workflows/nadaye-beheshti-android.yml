name: Build Nadaye Beheshti Android v3

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v3 source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://at.adobe.com/5gv7sZFpfv2z2C6E' -o /tmp/nadaye-v3.zip
          echo 'aeb506beb01745e406a25e6e068616e2ba91cf335ead2a79af86150deb6024e4  /tmp/nadaye-v3.zip' | sha256sum -c -
          unzip -o /tmp/nadaye-v3.zip -d android-nadaye

      - name: Prepare Quran and verified Shia adhan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-nadaye/app/src/main/assets android-nadaye/app/src/main/res/raw
          curl -L --fail --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json

          : > /tmp/shia-adhan-pages.html
          for page in \
            'https://shiavoice.com/play-0wonG' \
            'https://shiavoice.com/play-j7q3b' \
            'https://shiavoice.com/play-7Lntd' \
            'https://shiavoice.com/play-EPfRi' \
            'https://www.shiasource.com/audio/adhaan/' \
            'https://www.shiasource.com/audio/category/adhaan/'; do
            echo "FETCH PAGE: $page"
            curl -A 'Mozilla/5.0' -L --fail --retry 2 --retry-delay 1 "$page" >> /tmp/shia-adhan-pages.html || true
          done
          python3 - <<'PY' > /tmp/shia-audio-candidates.txt
          import html,re
          from pathlib import Path
          from urllib.parse import urljoin
          s=html.unescape(Path('/tmp/shia-adhan-pages.html').read_text(encoding='utf-8',errors='ignore')).replace('\\/','/')
          found=[]
          pats=[
            r'https?://[^"\'<> ]+\.(?:mp3|m4a|ogg)(?:\?[^"\'<> ]*)?',
            r'/(?:[^"\'<> ]*/)*[^"\'<> ]+\.(?:mp3|m4a|ogg)(?:\?[^"\'<> ]*)?'
          ]
          for pat in pats:
              for x in re.findall(pat,s,re.I):
                  for base in ('https://shiavoice.com/','https://www.shiasource.com/'):
                      u=urljoin(base,x)
                      if u not in found: found.append(u)
          found.sort(key=lambda u:(0 if 'shiavoice' in u else 1,u))
          print('\n'.join(found))
          PY
          echo 'Shia audio candidates:'
          cat /tmp/shia-audio-candidates.txt || true
          : > /tmp/adhan.ok
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            if curl -A 'Mozilla/5.0' -L --fail --retry 2 --retry-delay 1 "$u" -o /tmp/candidate-audio; then
              bytes=$(stat -c%s /tmp/candidate-audio)
              if [ "$bytes" -gt 100000 ]; then
                if python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/candidate-audio').read_bytes()[:16]
          assert h[:3]==b'ID3' or h[:1]==b'\xff' or h[4:8]==b'ftyp' or h[:4]==b'OggS'
          PY
                then
                  cp /tmp/candidate-audio android-nadaye/app/src/main/res/raw/adhan_shia_abather.mp3
                  echo "$u" > /tmp/adhan.ok
                  break
                fi
              fi
            fi
          done < /tmp/shia-audio-candidates.txt
          test -s /tmp/adhan.ok
          echo 'Selected Shia adhan:'; cat /tmp/adhan.ok

          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('android-nadaye/app/src/main/assets/quran.json')
          d=json.loads(q.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==114
          verses=sum(len(x.get('verses',[])) for x in d)
          assert verses>=6200
          a=Path('android-nadaye/app/src/main/res/raw/adhan_shia_abather.mp3')
          assert a.stat().st_size>100000
          hero=Path('android-nadaye/app/src/main/res/drawable-nodpi/leader_hero.jpg')
          assert hero.exists() and hero.stat().st_size>10000
          print('Validated:',len(d),'surahs,',verses,'verses, Shia adhan',a.stat().st_size,'bytes')
          PY

      - name: Build release APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Align unsigned APK and collect signing tool
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$UNSIGNED"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          test -x "$ZIPALIGN"
          test -s "$APKSIGNER_JAR"
          "$ZIPALIGN" -f 4 "$UNSIGNED" Nadaye-Beheshti-3.0-aligned-unsigned.apk
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Smoke check unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Nadaye-Beheshti-3.0-aligned-unsigned.apk
          unzip -t Nadaye-Beheshti-3.0-aligned-unsigned.apk >/dev/null
          unzip -l Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep 'assets/quran.json' >/dev/null
          unzip -l Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep -E 'res/.+\.mp3' >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep "package: name='com.nadaye.beheshti'" >/dev/null
          "$AAPT" dump badging Nadaye-Beheshti-3.0-aligned-unsigned.apk | grep "versionCode='3'" >/dev/null
          sha256sum Nadaye-Beheshti-3.0-aligned-unsigned.apk > UNSIGNED-SHA256.txt
          echo 'Unsigned APK smoke checks passed'

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-3.0-Unsigned
          path: |
            Nadaye-Beheshti-3.0-aligned-unsigned.apk
            apksigner.jar
            UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 30
