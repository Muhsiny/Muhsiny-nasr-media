name: Build Nadaye Beheshti Android v4.1 hardened

on:
  push:
    branches: [ nadaye-beheshti-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply premium v4 source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://at.adobe.com/KYtdZd634HeDuZGm' -o /tmp/nadaye-v4.zip
          echo 'e7e4a578e91f119d7164eba0e9cdc3ca6de7014a09a353f821467c9b53492237  /tmp/nadaye-v4.zip' | sha256sum -c -
          unzip -o /tmp/nadaye-v4.zip -d android-nadaye
          grep -q 'void showAdminStudio()' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'hiddenTapCount>=7' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'class FeatureIconView' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'View makeBottomNav()' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'void startHomeTicker()' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q '!"طلوع".equals(e.getKey())' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'static class PersianDate' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'builtInAdhanNames' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'stream-0wonG' android-nadaye/app/src/main/java/com/nadaye/beheshti/AdhanService.java
          grep -q 'android.intent.action.TIMEZONE_CHANGED' android-nadaye/app/src/main/AndroidManifest.xml
          ! grep -q 'FIT_XY' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          echo 'Premium responsive home, owner studio, Shia muezzins and resilient alarm receivers are present.'

      - name: Apply post-overlay v4.1 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 android-hardening/apply.py
          grep -q 'versionCode 6' android-nadaye/app/build.gradle
          grep -q "versionName '4.1.0'" android-nadaye/app/build.gradle
          grep -q 'ensureExactAlarmAccess' android-nadaye/app/src/main/java/com/nadaye/beheshti/MainActivity.java
          grep -q 'allowBackup="false"' android-nadaye/app/src/main/AndroidManifest.xml

      - name: Prepare verified offline Quran text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-nadaye/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/risan/quran-json/main/dist/quran.json' -o android-nadaye/app/src/main/assets/quran.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('android-nadaye/app/src/main/assets/quran.json')
          d=json.loads(q.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==114
          verses=sum(len(x.get('verses',[])) for x in d)
          assert verses>=6200
          assert d[0]['verses'][0]['text'].strip()
          hero=Path('android-nadaye/app/src/main/res/drawable-nodpi/leader_hero.jpg')
          assert hero.exists() and hero.stat().st_size>10000
          print('Validated Quran:',len(d),'surahs /',verses,'verses; hero:',hero.stat().st_size,'bytes')
          PY

      - name: Build release APK
        working-directory: android-nadaye
        run: gradle :app:assembleRelease --stacktrace

      - name: Align unsigned APK and collect signing tool
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android-nadaye/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$UNSIGNED"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          test -x "$ZIPALIGN"
          test -s "$APKSIGNER_JAR"
          "$ZIPALIGN" -f 4 "$UNSIGNED" Nadaye-Beheshti-4.1-aligned-unsigned.apk
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Smoke check unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK='Nadaye-Beheshti-4.1-aligned-unsigned.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F 'assets/quran.json' >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.nadaye.beheshti' versionCode='6' versionName='4.1.0'" /tmp/badging.txt >/dev/null
          sha256sum "$APK" > UNSIGNED-SHA256.txt
          echo 'Unsigned APK smoke checks passed'

      - uses: actions/upload-artifact@v4
        with:
          name: Nadaye-Beheshti-4.1-Unsigned
          path: |
            Nadaye-Beheshti-4.1-aligned-unsigned.apk
            apksigner.jar
            UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 30
