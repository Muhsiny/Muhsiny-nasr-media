name: Probe Original NASR Backend Direct
on:
  push:
    branches: [nasr-original-appdeploy]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct AppDeploy backend
        shell: bash
        run: |
          set +e
          for u in             "https://api-v2.appdeploy.ai/app/9fa07d2490ea176ad3/api/articles"             "https://api-v2.appdeploy.ai/app/9fa07d2490ea176ad3/api/settings"             "https://api-v2.appdeploy.ai/app/9fa07d2490ea176ad3/api/offline-pack"             "https://api-v2.appdeploy.ai/app/9fa07d2490ea176ad3/_warmup"; do
            echo "=== $u ==="
            curl -sS -i -L --max-time 25 "$u" | head -c 12000
            echo
          done
          exit 0
