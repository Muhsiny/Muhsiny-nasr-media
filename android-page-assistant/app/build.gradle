plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medianetwork.pageassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.medianetwork.pageassistant'
        minSdk 21
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('MPA_KEYSTORE')
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv('MPA_STORE_PASS')
                keyAlias System.getenv('MPA_KEY_ALIAS')
                keyPassword System.getenv('MPA_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (System.getenv('MPA_KEYSTORE') != null) signingConfig signingConfigs.release
        }
    }
}
