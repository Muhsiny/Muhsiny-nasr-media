plugins { id 'com.android.application' }

android {
    namespace 'com.nadaye.beheshti'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nadaye.beheshti'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
